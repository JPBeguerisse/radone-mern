#certbot configuration for social-app.jeanbeguerisse.com
server {
  listen 80;
  server_name social-app.jeanbeguerisse.com;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name social-app.jeanbeguerisse.com;

  ssl_certificate /etc/letsencrypt/live/social-app.jeanbeguerisse.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/social-app.jeanbeguerisse.com/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://server:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    chunked_transfer_encoding off;

    add_header Access-Control-Allow-Origin https://social-app.jeanbeguerisse.com always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE, PATCH" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    if ($request_method = OPTIONS) {
      add_header Content-Length 0;
      return 204;
    }
  }
}